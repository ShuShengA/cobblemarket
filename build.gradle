import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
	id 'architectury-plugin' version "${architectury_plugin_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
	id 'com.gradleup.shadow' version "${shadow_version}" apply false
	id 'maven-publish'
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	group = rootProject.group
	version = rootProject.version
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'
	apply plugin: 'org.jetbrains.kotlin.jvm'
	apply plugin: 'maven-publish'

	base {
		archivesName = "cobblemarket-${project.name}"
	}

	// 产物文件名带上 MC 版本（cobblemarket-fabric-1.2.0+1.21.1.jar）：玩家在 mods 文件夹和下载页
	// 一眼看出对应哪个 Minecraft（照 Cobblemon 本体的文件命名习惯）。
	// ⚠ 只改**文件名**，不动 project.version —— jar 内的 mod 版本仍是纯 1.2.0，与 CHANGELOG / 官网 /
	// GitHub tag 口径一致；`+` 后是 semver 的 build metadata，不参与版本比较，适合放文件名而非版本号。
	tasks.withType(AbstractArchiveTask).configureEach {
		archiveVersion.set("${project.version}+${minecraft_version}")
	}

	repositories {
		maven {
			name = "Modrinth"
			url = "https://api.modrinth.com/maven"
			content {
				includeGroup "maven.modrinth"
			}
		}
		maven {
			name = "Cobblemon"
			url = "https://impactdev.net"
			// 只服务 Cobblemon 官方坐标，避免解析 neoforge 等依赖时误撞该仓库超时
			content {
				includeGroup "com.cobblemon"
			}
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
			content {
				includeGroup 'dev.architectury'
			}
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	kotlin {
		compilerOptions {
			jvmTarget = JvmTarget.JVM_21
		}
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}
}
