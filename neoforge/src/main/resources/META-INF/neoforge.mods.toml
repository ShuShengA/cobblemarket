modLoader="javafml"
loaderVersion="[4,)"
license="GPL-3.0-only"

[[mods]]
modId="cobblemarket"
version="${version}"
displayName="CobbleMarket"
displayURL="https://shushenga.github.io/CobbleMarket-Website/"
authors="Shu_ShengA"
description='''A player-to-player trading market for Cobblemon: buy and sell Pokémon and items, with configurable listing fees, per-player bans, transaction history, expired listing returns, and optional currency support for Cobblemon Economy / CobbleDollars / Impactor / item currency.
面向 Cobblemon 服务器的玩家交易市场：支持精灵与物品挂单买卖、可配置手续费、封禁、交易历史、过期退回，支持 Cobblemon Economy / CobbleDollars / Impactor / 物品（虚拟货币或物品货币）。'''

[[dependencies.cobblemarket]]
modId="neoforge"
type="required"
versionRange="[21.1.215,)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemarket]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemarket]]
modId="kotlinforforge"
type="required"
versionRange="[5.12.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemarket]]
modId="cobblemon"
type="required"
versionRange="[1.8.0,1.9.0)"
ordering="NONE"
side="BOTH"

# 客户端 mixin（ScreenMixin，庆祝动画渲染），配置与 refmap 随 common 打进 jar；
# clientOnly 保证专用服务器不解析客户端 mixin 配置
[[mixins]]
config="cobblemarket.client.mixins.json"
clientOnly=true

# 服务端 mixin（tab 列表伪装监视者的游戏模式），两端都加载。
# ⚠ NeoForge 端必须用**不带 refmap** 的配置：mixin 类的注解已被 architectury-transformer
#   转成 official 名，而 common 的 cobblemarket.mixins.json 带的是 named:intermediary refmap
#   —— Mixin 在 NeoForge 运行时会把注解解析成 intermediary 类（class_2703）并注入失败
#   （2026-11-17 实测日志：InvalidInjectionException，target class 'net/minecraft/class_2703'）。
[[mixins]]
config="cobblemarket.neoforge.mixins.json"
