plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	// neoforge 侧映射 = yarn 打底 + neoforge patch 层（loom layered 合成单一依赖）
	mappings loom.layered {
		it.mappings("net.fabricmc:yarn:${rootProject.yarn_mappings}:v2")
		it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${rootProject.yarn_mappings_patch_neoforge_version}")
	}
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

	modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
	// Kotlin for Forge + neoforge 版 Cobblemon（1.7.3 与 fabric 端一致）
	modImplementation "maven.modrinth:kotlin-for-forge:uhJhCT7X"
	modImplementation "maven.modrinth:cobblemon:S1TrAn8c"
	// Cobblemon Economy 无 neoforge 版：货币自动降级 CobbleDollars / 物品（方案第三节 CobecoBridge）
	modCompileOnly "maven.modrinth:cobbledollars:Iqiqjfsi"
	modCompileOnly "maven.modrinth:cobblemon-smartphone:TXLuE5FW"

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'

	// mixin 配置/refmap 随 common 的 shadowBundle jar 原样打进（named:intermediary 形态，
	// neoforge 21.1 运行时原生支持该命名空间——Cobblemon neoforge 版同形态实证）

	// neoforge 不支持 loom split env（forge 平台 + split jars 冲突），单源集：
	// 客户端实现类也放 main 源集，无需补 client 输出（与 fabric 模块不同）

	from(rootProject.file("LICENSE")) {
		rename { "${it}_neoforge" }
	}
}

remapJar {
	inputFile.set shadowJar.archiveFile
}
